<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ryan Yanko</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
</head>
<body>
  <div class="s">
    <a class="post-back" href="index.html">&lt;-- back</a>
    <div id="post-content">loading...</div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const post = params.get('post');
    if (!post) {
      document.getElementById('post-content').textContent = 'no post specified.';
    } else {
      fetch('posts/' + post + '.md')
        .then(r => {
          if (!r.ok) throw new Error('not found');
          return r.text();
        })
        .then(md => {
          document.getElementById('post-content').innerHTML = marked.parse(md);
          const h1 = document.querySelector('#post-content h1');
          if (h1) document.title = h1.textContent + ' -- ryan byanko';
        })
        .catch(() => {
          document.getElementById('post-content').textContent = 'post not found.';
        });
    }
  </script>
</body>
</html>
